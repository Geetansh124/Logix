services:
  # ===================================================
  # Logix Backend API + Real-time WebSockets (Express + Socket.io)
  # ===================================================
  - type: web
    name: logix-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npx sequelize-cli db:migrate && (npx sequelize-cli db:seed:all || true) && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: logix-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: logix-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: CLIENT_URL
        value: https://logix.vercel.app
      - key: SOCKET_CORS_ORIGIN
        value: https://logix.vercel.app
      - key: DB_SSL
        value: "true"

  # ===================================================
  # Logix In-Memory Cache & Pub/Sub (Redis)
  # ===================================================
  - type: redis
    name: logix-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  # ===================================================
  # Logix PostgreSQL Database
  # ===================================================
  - name: logix-postgres
    plan: free
    databaseName: logix_db
    user: logix_user
